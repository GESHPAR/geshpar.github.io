name: Auto Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scripts
        run: |
          python html_generator.py
          python auto_linker.py
          python update_inventory.py
          python auto_cleanup.py

      - name: Commit results
        uses: EndBug/add-and-commit@v9
        with:
          message: "به‌روزرسانی خودکار خروجی‌ها"
          default_author: github_actions
